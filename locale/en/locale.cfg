[mod-name]
Shay=Shay

[mod-description]
Shay=A track-laying locomotive that builds rails ahead of itself as it drives.

[entity-name]
shay-gun-locomotive=Shay Gun Locomotive
shay-mg-wagon=Shay MG Wagon
shay-locomotive=Shay Track-Layer Locomotive
shay-ramp-wagon=Shay Ramp Wagon
shay-cannon-wagon=Shay Cannon Wagon

[item-name]
shay-gun-locomotive=Shay Gun Locomotive
shay-mg-wagon=Shay MG Wagon
shay-locomotive=Shay Track-Layer Locomotive
shay-ramp-wagon=Shay Ramp Wagon
shay-cannon-wagon=Shay Cannon Wagon

[mod-setting-name]
shay-rail-item=Rail item
shay-cruise-speed=Cruise speed
shay-lanes=Parallel tracks
shay-lane-spacing=Parallel track spacing

[mod-setting-description]
shay-rail-item=The item the track layer consumes and places. It must place a straight rail; set this to a modded rail item to lay that track instead.
shay-cruise-speed=Self-drive throttle while cruising, in tiles per tick. 0.3 is about 64 km/h; vanilla trains top out at 1.2.
shay-lanes=How many tracks the Shay lays side by side. 1 keeps a single line; each extra track alternates right and left of the main line.
shay-lane-spacing=Tiles between parallel track centrelines, rounded down to an even number. 4 leaves room for a row of signals between tracks.

[controls]
shay-toggle-cruise=Toggle Shay cruise
shay-resupply=Send Shay to resupply rail
shay-toggle-manual=Toggle train manual mode
shay-demolition-mode=Cycle Shay demolition mode

[shay-message]
out-of-rail=Shay track layer is out of rail.
out-of-landfill=Shay track layer is out of landfill.
out-of-cliff-explosives=Shay track layer is out of cliff explosives.
out-of-concrete=Shay track layer is out of concrete.
out-of-trackside=Shay track layer is out of __1__.
cruise-on=Cruise on
cruise-off=Cruise off
resupply-start=Heading out for rail
resupply-done=Resupplied, back at the frontier
resupply-unfulfilled=The supply station couldn't stock what the trip needed; auto-resupply is off until the consist resumes work.
resupply-cancelled=Resupply cancelled, train is back in manual control.
no-supply-station=No supply station in the schedule.
resupply-no-path=No path to __1__, resupply aborted.
resupply-dead-end=Shay needs a back-facing locomotive to leave dead ends.
resupply-no-return=The last laid rail is gone; resupply ends at __1__.
resupply-facing-away=Shay is facing away from the frontier; cruise not resumed.
manual-on=Train in manual mode.
manual-off=Train in automatic mode.
mode-lay=Shay mode: lay.
mode-bulldozer=Shay mode: bulldozer, tearing up track behind.
mode-maintenance=Shay mode: maintenance, relaying the line ahead.
mode-off=Shay mode: off.
demolish-cargo-full=Shay cargo is full; demolition paused.
